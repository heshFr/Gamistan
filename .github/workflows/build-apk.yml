name: Build APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      apk_bulk_mb:
        description: "Filler asset size in MB to grow the APK toward the size target"
        required: false
        default: "950"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      # Manual runs produce the big (~1 GB) release APK; pushes stay lean & fast.
      - name: Decide filler size
        id: size
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mb=${{ github.event.inputs.apk_bulk_mb }}" >> "$GITHUB_OUTPUT"
          else
            echo "mb=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate filler assets
        env:
          APK_BULK_MB: ${{ steps.size.outputs.mb }}
        run: node scripts/generate-bulk-assets.js

      - name: Add Android platform
        run: npx cap add android

      - name: Give Gradle more memory (large assets)
        run: |
          echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g" >> android/gradle.properties

      - name: Sync web assets into Android project
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Stage APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/NineLives-${{ github.run_number }}.apk"
          ls -lh out

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NineLives-apk
          path: out/*.apk

      - name: Publish GitHub Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Nine Lives v1.0.${{ github.run_number }}
          body: |
            🐱 **Nine Lives** — race the ghosts of your past nine lives.

            Download `NineLives-${{ github.run_number }}.apk` below and install on Android
            (enable "Install from unknown sources").

            Filler asset size: ${{ steps.size.outputs.mb }} MB.
          files: out/*.apk
