<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2a6a"/><stop offset="1" stop-color="#1a1033"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- tail -->
  <path d="M300 300 Q400 290 380 210" stroke="#2b2b3a" stroke-width="34" fill="none" stroke-linecap="round"/>
  <!-- body -->
  <ellipse cx="256" cy="276" rx="150" ry="142" fill="#2b2b3a"/>
  <!-- ears -->
  <polygon points="150,170 200,90 220,180" fill="#2b2b3a"/>
  <polygon points="362,170 312,90 292,180" fill="#2b2b3a"/>
  <polygon points="168,165 198,118 212,172" fill="#ff9ad6"/>
  <polygon points="344,165 314,118 300,172" fill="#ff9ad6"/>
  <!-- belly -->
  <ellipse cx="256" cy="350" rx="80" ry="92" fill="#fff7fb"/>
  <!-- cheeks -->
  <circle cx="180" cy="300" r="26" fill="#ff77b4" opacity="0.5"/>
  <circle cx="332" cy="300" r="26" fill="#ff77b4" opacity="0.5"/>
  <!-- eyes -->
  <ellipse cx="206" cy="262" rx="30" ry="36" fill="#fff"/>
  <ellipse cx="306" cy="262" rx="30" ry="36" fill="#fff"/>
  <circle cx="206" cy="268" r="17" fill="#7cf29c"/>
  <circle cx="306" cy="268" r="17" fill="#7cf29c"/>
  <circle cx="200" cy="260" r="6" fill="#fff"/>
  <circle cx="300" cy="260" r="6" fill="#fff"/>
  <!-- nose -->
  <polygon points="256,300 242,288 270,288" fill="#ff6fae"/>
  <!-- whiskers -->
  <g stroke="#fff" stroke-width="5" stroke-linecap="round" opacity="0.8">
    <line x1="196" y1="300" x2="120" y2="288"/><line x1="196" y1="312" x2="122" y2="320"/>
    <line x1="316" y1="300" x2="392" y2="288"/><line x1="316" y1="312" x2="390" y2="320"/>
  </g>
</svg>
